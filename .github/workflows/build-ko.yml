# language: YAML / file: .github/workflows/build-ko.yml / runtime: GitHub Actions / target: Android15-6.6 GKI ARM64
name: Build CassR GKI Kernel Module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GKI_TAG: android15-6.6-2026-01_r34
  GKI_COMMIT: e56cf6b09cca2151bcee244b3d334fb68685ff57
  TARGET_UNAME: 6.6.118-android15-8-ge56cf6b09cca-ab15511674-4k

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libelf-dev libssl-dev \
            clang lld llvm bc git python3 file kmod

      - name: Fetch pinned AOSP GKI kernel source
        run: |
          git clone --depth 1 --branch "$GKI_TAG" \
            https://android.googlesource.com/kernel/common kernel-src
          actual_commit="$(git -C kernel-src rev-parse HEAD)"
          echo "AOSP commit: $actual_commit"
          test "$actual_commit" = "$GKI_COMMIT"

      - name: Configure matching GKI family
        run: |
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1 gki_defconfig
          grep -E '^(CONFIG_MODVERSIONS|CONFIG_MODULES|CONFIG_KPROBES)=' kernel-out/.config || true

      - name: Build kernel and generate Module.symvers
        run: |
          make -C kernel-src O="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1 -j4 Image modules
          test -s kernel-out/Module.symvers
          grep -w module_layout kernel-out/Module.symvers

      - name: Build external CassR module
        run: |
          make KDIR="$GITHUB_WORKSPACE/kernel-out" ARCH=arm64 LLVM=1
          test -s cassr_hook.ko
          file cassr_hook.ko
          modinfo cassr_hook.ko
          sha256sum cassr_hook.ko

      - name: Record diagnostic metadata
        run: |
          {
            echo "target_uname=$TARGET_UNAME"
            echo "source_tag=$GKI_TAG"
            echo "source_sha=$(git -C kernel-src rev-parse HEAD)"
            echo "built_vermagic=$(modinfo -F vermagic cassr_hook.ko)"
            echo "module_layout_crc=$(awk '$2 == "module_layout" { print $1 }' kernel-out/Module.symvers)"
            sha256sum cassr_hook.ko
          } > build-metadata.txt
          cat build-metadata.txt

      - name: Upload module and metadata
        uses: actions/upload-artifact@v4
        with:
          name: cassr_hook-gki.ko
          path: |
            cassr_hook.ko
            build-metadata.txt
          if-no-files-found: error
          retention-days: 30
